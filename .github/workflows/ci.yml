name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-config:
    name: release dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "v2.17.1"
          args: release --snapshot --clean --skip=sign
      - name: Verify release inventory
        run: |
          test -s dist/checksums.txt
          test -s dist/artifacts.json
          jq -e '[.[] | select(.type == "Archive")] | length == 2' \
            dist/artifacts.json >/dev/null
          jq -e '[.[] | select(.type == "Binary" and (.name == "fleetdeck-linux-amd64" or .name == "fleetdeck-linux-arm64"))] | length == 2' \
            dist/artifacts.json >/dev/null
          jq -e '[.[] | select(.type == "Checksum" and .name == "checksums.txt")] | length == 1' \
            dist/artifacts.json >/dev/null

  secret-scan:
    name: Public history contains no secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan complete public history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --exit-code 1 .

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
      - name: Build
        run: CGO_ENABLED=1 go build ./...
      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage report
        run: go tool cover -func=coverage.out

  integration-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build, test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
      - name: Verify Docker
        run: docker version && docker compose version
      - name: Run deploy integration tests
        run: go test -v -tags=integration -run TestIntegration ./internal/deploy/...
        env:
          FLEETDECK_INTEGRATION: "true"

  integration-ssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build, test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
      - name: Start SSH server
        run: |
          ssh-keygen -t ed25519 -f /tmp/testkey -N '' -q
          docker run -d --name sshd \
            -p 2222:2222 \
            -e USER_NAME=fleetdeck \
            -e PUBLIC_KEY="$(cat /tmp/testkey.pub)" \
            linuxserver/openssh-server@sha256:96b9a4d3b5106746d08d43a6911650d4d21f7d5c7f2ac9660e792bdb5e63157c
          # Wait for SSH to be ready
          for _ in $(seq 1 30); do
            if ssh-keyscan -p 2222 localhost 2>/dev/null | grep -q ssh; then
              break
            fi
            sleep 1
          done
      - name: Run SSH integration tests
        run: go test -v -tags=integration -run TestIntegration ./internal/remote/...
        env:
          FLEETDECK_INTEGRATION: "true"
          SSH_TEST_HOST: localhost
          SSH_TEST_PORT: "2222"
          SSH_TEST_USER: fleetdeck
          SSH_TEST_KEY: /tmp/testkey
