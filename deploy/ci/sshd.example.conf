# Add this dedicated account to the existing AllowUsers list separately.
# Personal administrators retain their existing key + phone MFA policy.
Match User fleetdeck-ci-example
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/fleetdeck-ci/%u
    ForceCommand /usr/local/sbin/fleetdeck-ci-example
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    PermitUserEnvironment no
    MaxSessions 1
Match all
